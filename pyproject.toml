[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-telegram-bridge"
version = "0.1.0"
description = "Private Telegram interface to a shared local Codex App Server"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12,<4", "Pillow>=12,<13"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
codex-bridge = "codex_bridge.main:main"
codex-tg = "codex_bridge.main:launch"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_bridge"]
